# Coolify: New Resource → Git repository → Build pack Docker Compose.
# Base directory: /
# Compose file: docker-compose.yml
# Set JWT_SECRET, ADMIN_EMAIL, and ADMIN_PASSWORD in Coolify before the first deploy.
# Those values are read when the container starts. They are not required to build the image.
# Coolify's build command only receives build-time variables, so do not use ${VAR:?} here.
# SERVICE_URL_APP_3000 tells Coolify to publish the app on port 3000.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      mongo:
        condition: service_healthy
    expose:
      - "3000"
    # Coolify skips the proxy backend when the domain has no container port.
    # That is Traefik's "404 page not found" on HTTP and "no available server" on HTTPS.
    # These names match fqdnLabelsForTraefik() for service "app" (with and without the name hash).
    labels:
      - traefik.enable=true
      - traefik.http.routers.http-0-${COOLIFY_RESOURCE_UUID}-app.service=http-0-${COOLIFY_RESOURCE_UUID}-app
      - traefik.http.services.http-0-${COOLIFY_RESOURCE_UUID}-app.loadbalancer.server.port=3000
      - traefik.http.routers.https-0-${COOLIFY_RESOURCE_UUID}-app.service=https-0-${COOLIFY_RESOURCE_UUID}-app
      - traefik.http.services.https-0-${COOLIFY_RESOURCE_UUID}-app.loadbalancer.server.port=3000
      - traefik.http.routers.http-0-${COOLIFY_RESOURCE_UUID}-app-d2a5.service=http-0-${COOLIFY_RESOURCE_UUID}-app-d2a5
      - traefik.http.services.http-0-${COOLIFY_RESOURCE_UUID}-app-d2a5.loadbalancer.server.port=3000
      - traefik.http.routers.https-0-${COOLIFY_RESOURCE_UUID}-app-d2a5.service=https-0-${COOLIFY_RESOURCE_UUID}-app-d2a5
      - traefik.http.services.https-0-${COOLIFY_RESOURCE_UUID}-app-d2a5.loadbalancer.server.port=3000
    environment:
      SERVICE_URL_APP_3000: /
      NODE_ENV: production
      PORT: "3000"
      MONGODB_URI: mongodb://mongo:27017/secure_notes
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)'"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  mongo_data:
